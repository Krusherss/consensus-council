[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consensus-council"
version = "0.3.0"
description = "Multi-model voting and three-stage deliberation with blind peer review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Max" },
]
keywords = [
    "llm",
    "consensus",
    "voting",
    "multi-model",
    "anti-sycophancy",
    "deliberation",
    "peer-review",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40.0",
    "click>=8.0",
    "rich>=13.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
search = [
    "duckduckgo-search>=6.0",
    "trafilatura>=1.6",
]
claude-code = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "requests>=2.31.0",
    "duckduckgo-search>=6.0",
    "trafilatura>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
consensus-council = "consensus_council.cli:main"

[project.urls]
Homepage = "https://github.com/Krusherss/consensus-council"
Repository = "https://github.com/Krusherss/consensus-council"
Issues = "https://github.com/Krusherss/consensus-council/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/consensus_council"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
